# Nightly encrypted pg_dump of the production Supabase DB → GitHub artifact.
#
# Why this exists: Supabase's FREE plan has NO automated backups, and the
# league save is irreplaceable (docs/DEPLOY.md §8). This is the supplementary
# net; upgrade to Supabase Pro if you want provider-side PITR.
#
# ENCRYPTION IS MANDATORY: this repo is public, and public-repo artifacts are
# downloadable by any logged-in GitHub user. A raw dump carries manager emails
# and live session ids. AES-256, passphrase in the BACKUP_PASSPHRASE secret.
#
# ── IT USED TO SKIP SILENTLY, AND THAT WAS THE DEFECT ───────────────────────
# The first version ended its guard with `echo "secrets not configured —
# skipping (pre-launch)"; exit 0`. A run with no secrets was GREEN and uploaded
# nothing, which is indistinguishable in the Actions list from a run that
# backed the league up. The rollback for a FORWARD-ONLY migration rested on
# that (0003 claims every player row and cannot be undone), so the one thing
# this job must never do is report success without an artifact.
#
# Two rules now:
#   1. NO SECRETS → THE JOB FAILS. Loudly, with ::error::, every night, until
#      someone sets them. A red backup job is information; a green one that did
#      nothing is a trap.
#   2. THE ARTIFACT IS VERIFIED BEFORE IT IS UPLOADED. The job decrypts its own
#      output, gunzips it, and checks for pg_dump's completion marker. A dump
#      cut short by a dropped connection encrypts and compresses perfectly and
#      is missing rows in silence — the marker is the only cheap proof it ran to
#      the end. The file is only given its `league-*.sql.gz.enc` name after it
#      passes, so the upload step cannot pick up an unverified one.
#
# A green run therefore means: the dump completed, it decrypts with the stored
# passphrase, and it is whole. It does NOT mean it restores — nothing but a
# restore proves that. Run `scripts/verify-backup.sh <artifact>` on the
# downloaded file before you trust it with anything irreversible; the runbook
# (docs/RUNBOOK-operator-sitting.md §2) makes that a required step of the
# operator sitting.
#
# The dump is deliberately NOT restricted with --schema. `pg_dump -n public`
# emits `CREATE SCHEMA public`, which fails on restore into a fresh database
# that already has one (verified locally, 2026-08-13). Unrestricted is the form
# whose restore is proven.

name: backup

on:
  schedule:
    - cron: '17 3 * * *' # nightly, 03:17 UTC — off the :00 crunch
  workflow_dispatch:

jobs:
  pg-dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout (for scripts/ and the restore instructions)
        uses: actions/checkout@v4

      - name: the secrets must exist — no silent skip
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=""
          [ -n "$PROD_DATABASE_URL" ] || missing="$missing PROD_DATABASE_URL"
          [ -n "$BACKUP_PASSPHRASE" ] || missing="$missing BACKUP_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::error title=backup cannot run::missing repo secret(s):$missing — the league is NOT being backed up. Settings → Secrets and variables → Actions. See docs/DEPLOY.md §8."
            exit 1
          fi
          echo "both secrets present"

      - name: dump + encrypt
        shell: bash # explicit → -o pipefail, so a failed pg_dump fails the step
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # pg_dump from the postgres:17 image so the client is never older than
          # the Supabase server (new projects are Postgres 17). Restore with a
          # psql at least this new: the dump carries a \restrict header that an
          # older client does not understand.
          docker run --rm postgres:17-alpine \
            pg_dump --no-owner --no-privileges --dbname "$PROD_DATABASE_URL" \
            | gzip \
            | openssl enc -aes-256-cbc -pbkdf2 -pass env:BACKUP_PASSPHRASE \
            > unverified.sql.gz.enc
          ls -l unverified.sql.gz.enc

      - name: VERIFY the artifact, then name it
        shell: bash
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          size=$(wc -c < unverified.sql.gz.enc)
          if [ "$size" -lt 1024 ]; then
            echo "::error title=backup is not a database::the encrypted dump is ${size} bytes"
            exit 1
          fi

          # decrypt → gunzip → does it carry pg_dump's own last line?
          if ! openssl enc -d -aes-256-cbc -pbkdf2 -pass env:BACKUP_PASSPHRASE \
                 -in unverified.sql.gz.enc > plain.sql.gz; then
            echo "::error title=backup does not decrypt::BACKUP_PASSPHRASE does not open the file this job just wrote"
            exit 1
          fi
          if ! gunzip -c plain.sql.gz > plain.sql; then
            echo "::error title=backup is corrupt::decrypted, but not valid gzip"
            exit 1
          fi
          if ! grep -q '^-- PostgreSQL database dump complete' plain.sql; then
            echo "::error title=backup is TRUNCATED::no completion marker — pg_dump did not reach the end, so rows are missing"
            exit 1
          fi

          echo "verified: $(wc -l < plain.sql) SQL lines, $(du -h plain.sql | cut -f1) uncompressed, ${size} bytes encrypted"
          rm -f plain.sql plain.sql.gz
          # only NOW does it get the name the upload step globs for
          mv unverified.sql.gz.enc "league-$(date -u +%F).sql.gz.enc"
          ls -lh league-*.sql.gz.enc

      - name: upload artifact (30-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: league-backup-${{ github.run_id }}
          path: league-*.sql.gz.enc
          retention-days: 30
          if-no-files-found: error
